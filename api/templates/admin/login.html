<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Music Migration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-xl border border-gray-200 p-8 w-full max-w-sm shadow-sm">
    <h1 class="text-xl font-bold mb-6 text-center">🛠 Admin</h1>

    {% if error %}
    <div class="bg-red-50 border border-red-200 rounded-lg p-3 text-red-700 text-sm mb-4">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Пароль</label>
        <input name="password" type="password" autofocus
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-400">
      </div>
      <button type="submit"
        class="w-full bg-gray-900 text-white py-2 rounded-lg hover:bg-gray-700 font-medium">
        Войти
      </button>
    </form>
  </div>
</body>
</html>
