<!DOCTYPE html>
<html lang="{{ lang or 'ru' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Music Migration{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse-bar {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-spin-slow { animation: spin 1s linear infinite; }
    .animate-pulse-bar { animation: pulse-bar 1.5s ease-in-out infinite; }
    .animate-slide-in  { animation: slide-in .25s ease-out both; }

    /* indeterminate progress bar */
    .progress-indeterminate {
      background: linear-gradient(90deg, transparent 0%, #6366f1 40%, transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }

    /* mobile nav */
    #mobile-menu { display: none; }
    #mobile-menu.open { display: block; }

    /* HTMX loading indicator */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: block; }
    .htmx-request.htmx-indicator { display: block; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 antialiased">

  <nav class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">
      <a href="/" class="flex items-center gap-2 text-indigo-600 font-semibold hover:text-indigo-800 shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/>
        </svg>
        Music Migration
      </a>

      <!-- Desktop links -->
      <div class="hidden sm:flex items-center gap-1 text-sm">
        {% if has_migrations %}
        <a href="/history" class="px-3 py-1.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-indigo-600 transition">{{ t('nav_my_transfers') }}</a>
        {% endif %}
        <!-- Language switcher -->
        {% if lang == 'en' %}
        <a href="/set-lang?lang=ru&next={{ request.url.path }}"
           class="px-2 py-1.5 rounded-lg text-base hover:bg-gray-100 transition" title="Русский">🇷🇺</a>
        {% else %}
        <a href="/set-lang?lang=en&next={{ request.url.path }}"
           class="px-2 py-1.5 rounded-lg text-base hover:bg-gray-100 transition" title="English">🇬🇧</a>
        {% endif %}
      </div>

      <!-- Hamburger -->
      <button id="menu-toggle" class="sm:hidden p-2 rounded-lg text-gray-500 hover:bg-gray-100"
        onclick="document.getElementById('mobile-menu').classList.toggle('open')">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="sm:hidden border-t border-gray-100 bg-white px-4 py-2 space-y-1 text-sm">
      {% if has_migrations %}
      <a href="/history" class="block px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">{{ t('nav_my_transfers') }}</a>
      {% endif %}
      {% if lang == 'en' %}
      <a href="/set-lang?lang=ru&next={{ request.url.path }}" class="block px-3 py-2 rounded-lg text-gray-500 hover:bg-gray-100 text-xs font-medium">🇷🇺 Русский</a>
      {% else %}
      <a href="/set-lang?lang=en&next={{ request.url.path }}" class="block px-3 py-2 rounded-lg text-gray-500 hover:bg-gray-100 text-xs font-medium">🇬🇧 English</a>
      {% endif %}
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 py-8 sm:py-10 animate-slide-in">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
