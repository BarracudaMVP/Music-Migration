{% if to_services %}
<div class="space-y-3 animate-slide-in">
  <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">{{ t('step_to') }}</p>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
    {% for svc_id, svc_name in to_services.items() %}
    <button type="button"
      class="to-card flex flex-col items-center gap-2 border-2 border-gray-200 rounded-xl px-4 py-4 cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition text-sm font-medium text-gray-700 text-center"
      data-to="{{ svc_id }}"
      hx-get="/api/flow/rest?from={{ from_service }}&to={{ svc_id }}"
      hx-target="#step-rest"
      hx-swap="innerHTML"
      hx-indicator="#step-rest-loader"
      onclick="selectTo('{{ svc_id }}')"
    >
      <span class="text-2xl">{{ service_icons.get(svc_id, '🎵') }}</span>
      <span>{{ svc_name }}</span>
    </button>
    {% endfor %}

    <!-- Export to file card -->
    <button type="button"
      class="to-card flex flex-col items-center gap-2 border-2 border-gray-200 rounded-xl px-4 py-4 cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition text-sm font-medium text-gray-700 text-center"
      data-to="file_csv"
      hx-get="/api/flow/rest?from={{ from_service }}&to=file_csv"
      hx-target="#step-rest"
      hx-swap="innerHTML"
      hx-indicator="#step-rest-loader"
      onclick="selectTo('file_csv')"
    >
      <span class="text-2xl">📁</span>
      <span>{{ t('to_file_btn') }}</span>
    </button>
  </div>
</div>
{% else %}
<p class="text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-xl p-4">{{ t('index_no_routes') }}</p>
{% endif %}
