<div class="bg-white rounded-xl border border-gray-200 p-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="font-semibold text-sm">Предпросмотр: {{ filename }}</h2>
    <span class="text-xs text-gray-400">первые {{ preview|length }} строк</span>
  </div>

  <!-- Column mapping -->
  <form method="post" action="/import/start">
    <div class="flex gap-4 mb-4 flex-wrap">
      <div>
        <label class="block text-xs text-gray-500 mb-1">Колонка «Исполнитель»</label>
        <select name="artist_col" required
          class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          {% for col in columns %}
          <option value="{{ col }}" {% if col == auto_map.artist_col %}selected{% endif %}>{{ col }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Колонка «Название»</label>
        <select name="title_col" required
          class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          {% for col in columns %}
          <option value="{{ col }}" {% if col == auto_map.title_col %}selected{% endif %}>{{ col }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="flex items-end">
        <button type="submit"
          class="bg-indigo-600 text-white px-5 py-1.5 rounded-lg hover:bg-indigo-700 text-sm font-medium">
          Начать перенос
        </button>
      </div>
    </div>

    <!-- Preview table -->
    {% if preview %}
    <div class="overflow-x-auto">
      <table class="w-full text-xs">
        <thead>
          <tr class="text-left text-gray-400 border-b bg-gray-50">
            {% for col in columns %}
            <th class="px-3 py-1.5">{{ col }}</th>
            {% endfor %}
          </tr>
        </thead>
        <tbody>
          {% for row in preview %}
          <tr class="border-b border-gray-50 hover:bg-gray-50">
            {% for col in columns %}
            <td class="px-3 py-1 max-w-[200px] truncate text-gray-700" title="{{ row.get(col, '') }}">
              {{ row.get(col, '') }}
            </td>
            {% endfor %}
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    {% else %}
    <p class="text-gray-400 text-sm">Файл пуст.</p>
    {% endif %}
  </form>
</div>
