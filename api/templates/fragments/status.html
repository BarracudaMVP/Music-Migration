{% set polling = not done %}
<div
  id="status-block"
  {% if polling %}
  hx-get="/migrate/{{ migration_id }}/status-fragment"
  hx-trigger="every 3s"
  hx-swap="outerHTML"
  {% endif %}
  class="bg-white rounded-xl border border-gray-200 p-6 space-y-4"
>
  <div class="flex items-center justify-between">
    <span class="text-sm text-gray-500">Статус</span>
    <span class="font-semibold
      {% if migration.status == 'done' %}text-green-600
      {% elif migration.status == 'failed' %}text-red-600
      {% elif migration.status == 'cancelled' %}text-gray-500
      {% else %}text-indigo-600{% endif %}">
      {{ status_label }}
    </span>
  </div>

  {% if stats %}
  <table class="w-full text-sm">
    <thead>
      <tr class="text-left text-gray-400 border-b">
        <th class="pb-1">Статус треков</th>
        <th class="pb-1 text-right">Кол-во</th>
      </tr>
    </thead>
    <tbody>
      {% for s, cnt in stats.items() %}
      <tr class="border-b border-gray-50">
        <td class="py-1 capitalize">{{ s }}</td>
        <td class="py-1 text-right font-mono">{{ cnt }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% endif %}

  {% if done %}
  <div class="flex gap-3 pt-2">
    <a href="/migrate/{{ migration_id }}/result"
      class="flex-1 text-center bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium">
      Подробный отчёт
    </a>
    <a href="/migrate/{{ migration_id }}/export?fmt=csv"
      class="flex-1 text-center bg-gray-100 text-gray-700 py-2 rounded-lg hover:bg-gray-200 text-sm">
      Скачать CSV
    </a>
  </div>
  {% endif %}
</div>
