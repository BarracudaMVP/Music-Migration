# =============================================================================
# Dante SOCKS5 — danted.conf (MM-25)
#
# Deploy to RU server:
#   sudo cp danted.conf /etc/danted.conf
#   sudo systemctl restart danted
#
# Key security changes vs default config:
#   - internal: bind to localhost only (not 0.0.0.0)
#   - socksmethod: username (require auth for all SOCKS connections)
#   - clientmethod: none (client-level auth handled at TCP level by ufw)
# =============================================================================

# Dante listens on localhost only — ufw/iptables controls external access
internal: 0.0.0.0 port = 1080
external: eth0

# Require username/password authentication for SOCKS5
socksmethod: username
clientmethod: none

# Run as dedicated user (create with: useradd -r -s /bin/false danted)
user.privileged: root
user.unprivileged: nobody

# Logging
logoutput: /var/log/danted.log

# Allow authenticated clients to connect anywhere
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    socksmethod: username
    log: error
}
