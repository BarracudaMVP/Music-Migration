# Local development stack
#
# Includes: postgres + redis + api (port 8000) + frontend dev server (port 3000)
# Excludes: nginx, bot, worker (not needed for UI development)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:3000
#
# DO NOT use in production.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: musicmigration
      POSTGRES_USER: musicmigration
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicmigration"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - API_PROXY_TARGET=http://api:8000
    depends_on:
      - api
    networks:
      - app

volumes:
  postgres_dev_data:
  frontend_node_modules:

networks:
  app:
    driver: bridge
