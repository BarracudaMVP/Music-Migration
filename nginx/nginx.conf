# HTTP — certbot ACME challenge + redirect to HTTPS (catches any host/IP)
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://musicmigration.site$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl default_server;
    server_name musicmigration.site;

    ssl_certificate     /etc/letsencrypt/live/musicmigration.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musicmigration.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Redirect access by IP or other hostnames to the canonical domain
    if ($host != "musicmigration.site") {
        return 301 https://musicmigration.site$request_uri;
    }

    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
