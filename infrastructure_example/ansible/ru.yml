---
# RU server: SOCKS5 proxy security
# Configures ufw firewall + Dante with username auth
#
# Usage:
#   ansible-playbook -i inventory.yml ru.yml
#
# Variables (group_vars/all.yml):
#   eu_server_ip  — EU server IP whitelisted for port 1080
#   dev_ip        — (optional) dev machine IP for port 1080
#   dante_user    — Linux system user for SOCKS5 auth
#   dante_port    — SOCKS5 port (default: 1080)
#
# Secrets (group_vars/vault.yml, не коммитится):
#   vault_dante_password — password for dante_user

- name: Configure RU proxy server (ufw + Dante)
  hosts: ru
  become: true
  vars_files:
    - group_vars/vault.yml

  tasks:

    # ── Packages ──────────────────────────────────────────────────────────────

    - name: Install dante-server and ufw
      apt:
        name:
          - dante-server
          - ufw
        state: present
        update_cache: true

    # ── ufw firewall ──────────────────────────────────────────────────────────

    - name: Set ufw default policies
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Allow SSH (port 22)
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow SOCKS5 from EU server
      ufw:
        rule: allow
        port: "{{ dante_port | string }}"
        proto: tcp
        src: "{{ eu_server_ip }}"

    - name: Allow SOCKS5 from dev machine
      ufw:
        rule: allow
        port: "{{ dante_port | string }}"
        proto: tcp
        src: "{{ dev_ip }}"
      when: dev_ip | length > 0

    - name: Enable ufw
      ufw:
        state: enabled

    # ── Dante user ────────────────────────────────────────────────────────────

    - name: Create Dante system user
      user:
        name: "{{ dante_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Set Dante user password
      user:
        name: "{{ dante_user }}"
        password: "{{ vault_dante_password | password_hash('sha512') }}"
      no_log: true

    # ── Dante config ──────────────────────────────────────────────────────────

    - name: Deploy danted.conf
      template:
        src: templates/danted.conf.j2
        dest: /etc/danted.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart danted

    - name: Enable and start danted
      service:
        name: danted
        state: started
        enabled: true

    # ── Verification ──────────────────────────────────────────────────────────

    - name: Check ufw status
      command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Show ufw status
      debug:
        var: ufw_status.stdout_lines

  handlers:
    - name: Restart danted
      service:
        name: danted
        state: restarted
